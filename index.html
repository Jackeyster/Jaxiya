<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaxiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    color: #1f2a24;
    background: #f7f4ec;
  }

  a { color: #0a7d55; }
  a:hover { color: #075c3e; }

  /* ---------- Header / hero ---------- */
  .hero {
    /* Swap this gradient for your own photo if you like:
       background: linear-gradient(rgba(20,37,28,.55), rgba(20,37,28,.55)), url('images/YourPhoto.jpg') center/cover; */
    background: linear-gradient(160deg, #3b5a49 0%, #1f3a2d 55%, #14251c 100%);
    color: #ffffff;
  }

  .nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 24px 64px;
  }

  .logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
  }

  .nav-links { display: flex; flex-wrap: wrap; gap: 28px; }

  .nav-links a {
    color: #e4efe7;
    font-weight: 500;
    text-decoration: none;
    padding: 12px 0;
  }

  .nav-links a.active {
    color: #ffffff;
    font-weight: 600;
    border-bottom: 2px solid #ffffff;
  }

  .hero-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 64px;
    padding: 48px 64px 72px;
  }

  .hero-text {
    flex: 1 1 420px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .eyebrow {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #bfe0cb;
  }

  .hero h1 {
    margin: 0;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 68px;
    line-height: 1.05;
  }

  .tagline {
    margin: 0;
    font-size: 20px;
    line-height: 1.6;
    color: #e4efe7;
    max-width: 520px;
  }

  .buttons { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }

  .btn {
    display: inline-block;
    font-weight: 600;
    padding: 16px 28px;
    border-radius: 999px;
    text-decoration: none;
  }

  .btn-primary { background: #0a7d55; color: #ffffff; }
  .btn-primary:hover { background: #0c9367; color: #ffffff; }

  .btn-outline { border: 2px solid #ffffff; color: #ffffff; padding: 14px 28px; }
  .btn-outline:hover { background: rgba(255,255,255,.12); color: #ffffff; }

  /* Headshot: arched frame with an offset block behind it */
  .hero-photo {
    flex: 1 1 380px;
    min-width: 0;
    display: flex;
    justify-content: center;
  }

  .headshot-wrap {
    position: relative;
    width: 420px;
    max-width: 100%;
    height: 500px;
  }

  .headshot-wrap::before {
    content: "";
    position: absolute;
    top: 28px;
    left: 28px;
    right: -28px;
    bottom: -28px;
    background: #0a7d55;
    border-radius: 220px 220px 24px 24px;
  }

  .headshot-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 220px 220px 24px 24px;
    background: #d9d5c8;
  }

  /* ---------- Leaf background section ---------- */
  .leaf {
    position: relative;
    min-height: 60vh;
    padding: 64px;
    background-color: #f7f4ec;
  }

  /* The image sits on a layer behind the content, so only the
     image is faded to 35% and your text stays fully solid. */
  .leaf::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('images/LeafBackground.jpg') center / cover no-repeat;
    opacity: 0.35;
    z-index: 0;
  }

  .leaf > * { position: relative; z-index: 1; }

  /* ---------- Phones ---------- */
  @media (max-width: 700px) {
    .nav, .hero-inner, .leaf { padding-left: 24px; padding-right: 24px; }
    .hero h1 { font-size: 48px; }
    .headshot-wrap { height: 400px; }
  }
</style>
</head>

<body>

  <header class="hero">
    <div class="nav">
      <a class="logo" href="https://jaxiya.com/">Jaxiya</a>
      <nav class="nav-links">
        <a class="active" href="index.html">Home</a>
        <a href="curriculum.html">Resume</a>
        <a href="map.html">Food Map</a>
        <a href="photography.html">Photography</a>
      </nav>
    </div>

    <div class="hero-inner">
      <div class="hero-text">
        <div class="eyebrow">Hello, I'm</div>
        <h1>[Your Name]</h1>
        <p class="tagline">[Your profession] · Photographer · Food explorer</p>
        <div class="buttons">
          <a class="btn btn-primary" href="curriculum.html">View my resume</a>
          <a class="btn btn-outline" href="map.html">Explore the food map</a>
        </div>
      </div>

      <div class="hero-photo">
        <div class="headshot-wrap">
          <img src="images/Headshot1.png" alt="Portrait of [Your Name]">
        </div>
      </div>
    </div>
  </header>

  <main class="leaf">
    <!-- Add your content here -->
  </main>

</body>
</html>
